##### PREFIX #####
# Remap prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix


##### PANES #####
# Split panes with | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Navigate panes with Alt + arrows (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes with Alt + Shift + arrows
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5


##### MOUSE #####
# Enable mouse support everywhere
set -g mouse on


##### COPY MODE (PORTABLE CLIPBOARD) #####
# Vi-style copy mode
setw -g mode-keys vi

# macOS clipboard
if-shell 'uname | grep -q Darwin' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
if-shell 'uname | grep -q Darwin' \
  'bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"'
if-shell 'uname | grep -q Darwin' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"'

# Linux (Wayland)
if-shell 'uname | grep -q Linux && command -v wl-copy >/dev/null' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'
if-shell 'uname | grep -q Linux && command -v wl-copy >/dev/null' \
  'bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"'
if-shell 'uname | grep -q Linux && command -v wl-copy >/dev/null' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"'

# Linux (X11 fallback)
if-shell 'uname | grep -q Linux && command -v xclip >/dev/null' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"'
if-shell 'uname | grep -q Linux && command -v xclip >/dev/null' \
  'bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard"'
if-shell 'uname | grep -q Linux && command -v xclip >/dev/null' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"'


##### TERMINAL / COLORS #####
# Best default for modern tmux
set -g default-terminal "tmux-256color"

# True color support
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"


##### NEOVIM FRIENDLY #####
# Remove Esc delay
set -sg escape-time 0

# Allow applications to rename windows
set -g allow-rename on


##### STATUS BAR #####
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=black,fg=white"
set -g status-left "#[fg=green] #S "
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M "

set -g window-status-current-style "fg=black,bg=green"
set -g window-status-style "fg=white"


##### QUALITY OF LIFE #####
# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Faster repeat keys
set -g repeat-time 300

# Disable audible bell
set -g visual-bell on
set -g bell-action none


##### RELOAD CONFIG #####
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded ✅"
